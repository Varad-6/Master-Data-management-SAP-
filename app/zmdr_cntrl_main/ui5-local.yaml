# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: com.intapptics.zmdrcntrlmain
type: application
framework:
  name: SAPUI5
  version: 1.129.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: com.intapptics.zmdrcntrlmain
        ui5Theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap
            url: http://cloud9.way2erp.us:8000
            client: '400'
          - path: /api
            url: http://localhost:4004
          - path: /odata/v2
            url: http://localhost:4004
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZMDR_CNTRL_UICONFIG_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZMDGCPCNTRLURL01_CDS
            metadataPath: ./webapp/localService/ZMDGCPCNTRLURL01_CDS/metadata.xml
            mockdataPath: ./webapp/localService/ZMDGCPCNTRLURL01_CDS/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/ZMDGCPCNTRLURL01_CDS/ZMDGCPCNTRLURL01_CDS_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZMDGCPCNTRLURL01_CDS_VAN',Version='0001')/$value/
